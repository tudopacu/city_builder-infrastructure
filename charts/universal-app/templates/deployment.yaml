apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment
  labels:
    app: {{ .Values.appName }}
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 192.168.1.151
        searches:
          - default.svc.cluster.local
          - svc.cluster.local
          - cluster.local

      {{- if .Values.migrationCommand }}
      initContainers:
        - name: {{ .Values.appName }}-migration
          image: {{ .Values.image }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - {{ .Values.migrationCommand }}
          {{- if .Values.useSecrets }}
          envFrom:
            - secretRef:
                name: {{ .Values.useSecrets }}
          {{- end }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 10 }}
          {{- end }}
      {{- end }}

      containers:
        - name: {{ .Values.appName }}-container
          image: {{ .Values.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.containerPort }}
              hostPort: {{ .Values.hostPort }}
          {{- if .Values.useSecrets }}
          envFrom:
            - secretRef:
                name: {{ .Values.useSecrets }}
          {{- end }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 10 }}
          {{- end }}