appName: yii2-cms
image: ghcr.io/tudopacu/city_builder-cms:caea7e4f8558e326ebc037eb7cbf93d4d45fb8a0
containerPort: 80
hostPort: 8080
replicas: 1
useSecrets: app-credentials

migrationCommand: "php yii migrate --interactive=0"

env:
  - name: YII_ENV
    value: "dev"
  - name: YII_DEBUG
    value: "1"
  - name: COOKIE_VALIDATION_KEY
    value: "generate-a-random-long-secret-string-here"