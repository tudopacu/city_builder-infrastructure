appName: yii2-cms
image: ghcr.io/tudopacu/city_builder-cms:a50d428a4bb9e3d6d1fceddd3701071f55e6201a
containerPort: 80
hostPort: 8080
replicas: 1
useSecrets: app-credentials

migrationCommand: "php yii migrate --interactive=0"

env:
  - name: YII_ENV
    value: "dev"
  - name: YII_DEBUG
    value: "1"
  - name: COOKIE_VALIDATION_KEY
    value: "generate-a-random-long-secret-string-here"
  - name: IMAGE_BASE_URL
    value: "http://citybuilder.home.ro:8084/html"