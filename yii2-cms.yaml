appName: yii2-cms
image: ghcr.io/tudopacu/city_builder-cms:cd75b4f75a9017c3fbadad60b74b598d691a0bc9
containerPort: 80
hostPort: 8080
replicas: 1
useSecrets: app-credentials

migrationCommand: "php yii migrate --interactive=0"

env:
  - name: YII_ENV
    value: "dev"
  - name: YII_DEBUG
    value: "1"
  - name: COOKIE_VALIDATION_KEY
    value: "generate-a-random-long-secret-string-here"