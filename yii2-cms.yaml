appName: yii2-cms
image: ghcr.io/tudopacu/city_builder-cms:3903ce7f7722eae34211fca7a5e0c35929e646f4
containerPort: 80
hostPort: 8080
replicas: 1
useSecrets: app-credentials

migrationCommand: "php yii migrate --interactive=0"

env:
  - name: YII_ENV
    value: "dev"
  - name: YII_DEBUG
    value: "1"
  - name: COOKIE_VALIDATION_KEY
    value: "generate-a-random-long-secret-string-here"
  - name: IMAGE_BASE_URL
    value: "http://citybuilder.home.ro:8084/html"