appName: yii2-cms
image: ghcr.io/tudopacu/city_builder-cms:c20fd75c8f60765f0ddc79cfb8917871385accc0
containerPort: 80
hostPort: 8080
replicas: 1
useSecrets: app-credentials

migrationCommand: "php yii migrate --interactive=0"

env:
  - name: YII_ENV
    value: "dev"
  - name: YII_DEBUG
    value: "1"
  - name: COOKIE_VALIDATION_KEY
    value: "generate-a-random-long-secret-string-here"
  - name: IMAGE_BASE_URL
    value: "http://citybuilder.home.ro:8084/html"