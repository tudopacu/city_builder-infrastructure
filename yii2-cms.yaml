appName: yii2-cms
image: ghcr.io/tudopacu/city_builder-cms:bc165f99355f9f23bbb5a6bd52fc887ff16adeca
containerPort: 80
hostPort: 8080
replicas: 1
useSecrets: app-credentials

migrationCommand: "php yii migrate --interactive=0"

env:
  - name: YII_ENV
    value: "dev"
  - name: YII_DEBUG
    value: "1"
  - name: COOKIE_VALIDATION_KEY
    value: "generate-a-random-long-secret-string-here"